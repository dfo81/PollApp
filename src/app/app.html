<app-header [light]="light()" [createButton]="createButton()"></app-header>

<router-outlet></router-outlet>

<footer>
  <nav>
    <ul>
      <li><a routerLink="/legal">Impressum</a></li>
    </ul>
  </nav>
</footer>

<dialog
  #createDialog
  class="create-dialog"
  (close)="closeCreate()"
  (mousedown)="onDialogMouseDown($event)"
  (click)="onBackdropClick($event)"
>
  @if (createOpen()) {
    <app-create-survey (closed)="closeCreate()" (published)="onPublished()" />
  }
</dialog>
