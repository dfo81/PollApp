<div class="date-picker">
  <button
    class="date-trigger"
    type="button"
    #trigger
    aria-haspopup="dialog"
    [class.invalid]="invalid()"
    [attr.aria-label]="label()"
    [attr.aria-expanded]="open()"
    [attr.aria-activedescendant]="activeId()"
    [attr.aria-invalid]="invalid()"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
  >
    <span class="date-value">{{ display() }}</span>
    <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <!-- currentColor, so the colour comes from CSS instead of the asset. -->
      <path fill="currentColor" d="M11.5843 15.617L5.26163 9.44681C5.17442 9.3617 5.10901 9.2695 5.06541 9.17021C5.0218 9.07092 5 8.96454 5 8.85106C5 8.62411 5.07994 8.42553 5.23983 8.25532C5.39971 8.08511 5.61047 8 5.87209 8H19.1279C19.3895 8 19.6003 8.08511 19.7602 8.25532C19.9201 8.42553 20 8.62411 20 8.85106C20 8.9078 19.9128 9.10638 19.7384 9.44681L13.4157 15.617C13.2703 15.7589 13.125 15.8582 12.9797 15.9149C12.8343 15.9716 12.6744 16 12.5 16C12.3256 16 12.1657 15.9716 12.0203 15.9149C11.875 15.8582 11.7297 15.7589 11.5843 15.617Z" />
    </svg>
  </button>

  @if (open()) {
    <div class="calendar" role="dialog" [attr.aria-label]="label()">
      <div class="calendar-head">
        <button
          class="month-step"
          type="button"
          aria-label="Previous month"
          (click)="shiftMonth(-1)"
        >
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <!-- currentColor, so the colour comes from CSS instead of the asset. -->
            <path fill="currentColor" d="M11.5843 15.617L5.26163 9.44681C5.17442 9.3617 5.10901 9.2695 5.06541 9.17021C5.0218 9.07092 5 8.96454 5 8.85106C5 8.62411 5.07994 8.42553 5.23983 8.25532C5.39971 8.08511 5.61047 8 5.87209 8H19.1279C19.3895 8 19.6003 8.08511 19.7602 8.25532C19.9201 8.42553 20 8.62411 20 8.85106C20 8.9078 19.9128 9.10638 19.7384 9.44681L13.4157 15.617C13.2703 15.7589 13.125 15.8582 12.9797 15.9149C12.8343 15.9716 12.6744 16 12.5 16C12.3256 16 12.1657 15.9716 12.0203 15.9149C11.875 15.8582 11.7297 15.7589 11.5843 15.617Z" />
          </svg>
        </button>

        <span class="month-label" aria-live="polite">{{ monthLabel() }}</span>

        <button
          class="month-step next"
          type="button"
          aria-label="Next month"
          (click)="shiftMonth(1)"
        >
          <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <!-- currentColor, so the colour comes from CSS instead of the asset. -->
            <path fill="currentColor" d="M11.5843 15.617L5.26163 9.44681C5.17442 9.3617 5.10901 9.2695 5.06541 9.17021C5.0218 9.07092 5 8.96454 5 8.85106C5 8.62411 5.07994 8.42553 5.23983 8.25532C5.39971 8.08511 5.61047 8 5.87209 8H19.1279C19.3895 8 19.6003 8.08511 19.7602 8.25532C19.9201 8.42553 20 8.62411 20 8.85106C20 8.9078 19.9128 9.10638 19.7384 9.44681L13.4157 15.617C13.2703 15.7589 13.125 15.8582 12.9797 15.9149C12.8343 15.9716 12.6744 16 12.5 16C12.3256 16 12.1657 15.9716 12.0203 15.9149C11.875 15.8582 11.7297 15.7589 11.5843 15.617Z" />
          </svg>
        </button>
      </div>

      <div class="calendar-grid" role="grid">
        <div class="weekday-row" role="row">
          @for (weekday of weekdays; track $index) {
            <abbr class="weekday" role="columnheader" [attr.title]="weekday.long">
              {{ weekday.short }}
            </abbr>
          }
        </div>

        @for (week of weeks(); track $index) {
          <div class="week" role="row">
            @for (day of week; track day.iso) {
              <button
                class="day"
                type="button"
                role="gridcell"
                tabindex="-1"
                [id]="'day-' + day.iso"
                [class.outside]="!day.inMonth"
                [class.today]="day.today"
                [class.selected]="isSelected(day.iso)"
                [class.active]="isActive(day.iso)"
                [disabled]="day.disabled"
                [attr.aria-selected]="isSelected(day.iso)"
                (click)="pick(day)"
              >
                {{ day.label }}
              </button>
            }
          </div>
        }
      </div>
    </div>
  }
</div>
