<main>
  @if (survey.error()) {
    <p class="state error">This survey could not be loaded.</p>
  } @else if (survey.value(); as detail) {
    <app-published-survey [survey]="detail" (voted)="onVoted()" />
    <app-survey-results
      [results]="results.value()"
      [loading]="results.isLoading()"
      [live]="live(detail)"
    />
  } @else {
    <p class="state">Loading survey …</p>
  }
</main>
