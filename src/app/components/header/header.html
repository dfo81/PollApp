<header>
  <a routerLink="/">
    <img
      [src]="light() ? 'assets/icons/Logo_dark.svg' : 'assets/icons/Logo_light.svg'"
      alt="Logo"
    />
  </a>
  @if (createButton()) {
    <button class="btn-primary btn-reveal" type="button" (click)="openCreate()">
      Create survey <img src="assets/icons/add_circle_purple.svg" alt="" />
    </button>
  }
</header>
